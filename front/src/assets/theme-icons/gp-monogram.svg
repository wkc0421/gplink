<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GP monogram</title>
  <desc id="desc">A geometric blue GP monogram for the GPLink dark theme.</desc>
  <defs>
    <linearGradient id="surface" x1="18" y1="8" x2="142" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142A43"/>
      <stop offset="1" stop-color="#0B1728"/>
    </linearGradient>
    <linearGradient id="stroke" x1="24" y1="24" x2="136" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE3FF"/>
      <stop offset="0.48" stop-color="#52A0FF"/>
      <stop offset="1" stop-color="#2F80FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="152" height="120" rx="28" fill="url(#surface)" stroke="#29405C" stroke-width="2"/>
  <path d="M21 27 80 11l59 16" stroke="#2F80FF" stroke-opacity=".16" stroke-width="2"/>
  <path d="M21 101 80 117l59-16" stroke="#52A0FF" stroke-opacity=".12" stroke-width="2"/>

  <g stroke="url(#stroke)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- G: closed round bowl with a clear inner crossbar -->
    <path d="M68 40c-5.4-7.1-13.1-10.7-22.5-10.7-16.1 0-27.5 12.1-27.5 29.7S29.4 88.7 45.5 88.7c10.3 0 18.4-4.2 23.5-12.1V59.8H47"/>
    <!-- P -->
    <path d="M97 88V29h22c13.5 0 22 7.2 22 20.2 0 12.8-8.5 20.1-22 20.1H97"/>
  </g>

</svg>
