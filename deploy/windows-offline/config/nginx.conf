    # 前端项目部署位置
    #     svg (端口 8083)
    server {
        listen       8083;
        server_name  127.0.0.1;

        root         "D:/tool/nginx-1.26.3/html/gp-svg";
        index        index.html preview.html;

        # 开启压缩
        gzip on;
        gzip_static on;
        gzip_min_length 1k;
        gzip_types text/plain application/javascript text/css application/xml image/svg+xml;

        # history 路由
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
		# 反代后端服务
        location /admin-api/ {
                    proxy_pass http://127.0.0.1:48080/admin-api/; ## 重要！！！proxy_pass 需要设置为后端项目所在服务器的 IP
                    proxy_set_header Host $http_host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header REMOTE-HOST $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 静态资源强缓存
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

   # gpview
server {
    listen       8081;
    server_name  127.0.0.1;

    root         "D:/tool/nginx-1.26.3/html/gp-view";
    index        index.html;

    # 开启压缩
    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript text/css application/xml image/svg+xml;

    # 静态资源强缓存（放在 location / 之前，优先匹配）
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 前端路由入口（最后匹配，处理所有其他请求）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}


