http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
    proxy_buffer_size 1024k;
    proxy_buffers 16 1024k;
    proxy_busy_buffers_size 1024k;
    client_max_body_size    10m;

    #gzip  on;
    upstream iotserver {
        server 127.0.0.1:8848 weight=1; #轮询地址，请根据实际部署后端地址进行替换
        server 127.0.0.1:8848 weight=1;
        server 127.0.0.1:8848 weight=1;
    }

    server {
        listen 18078;
        server_name localhost;
        # gzip config
        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 9;
        gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
        gzip_vary on;
        gzip_disable "MSIE [1-6]\.";

        include mime.types;
        location / {
            root D:/tool/nginx-1.26.3/html/gpLink;
            index  index.html;
            try_files $uri $uri/ /index.html;
            #add_header Cache-Control no-cache;
            #add_header Cache-Control private;
        }
        location ^~/api/ {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout   60;
            proxy_buffering off;
            chunked_transfer_encoding off;
            proxy_cache off;
            proxy_send_timeout      30m;
            proxy_read_timeout      30m;
            proxy_pass http://iotserver/;
            proxy_ssl_server_name off;
        }
    }

    # GPLink2 additional entry point on port 18088.
    # This block intentionally mirrors the existing 18078 GPLink entry.
    server {
        listen 18088;
        server_name localhost;

        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 9;
        gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
        gzip_vary on;
        gzip_disable "MSIE [1-6]\.";

        include mime.types;
        location / {
            root D:/tool/nginx-1.26.3/html/gpLink2;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        location ^~ /api/ {
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60;
            proxy_buffering off;
            chunked_transfer_encoding off;
            proxy_cache off;
            proxy_send_timeout 30m;
            proxy_read_timeout 30m;
            proxy_pass http://iotserver/;
            proxy_ssl_server_name off;
        }
    }

